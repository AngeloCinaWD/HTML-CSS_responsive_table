<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <title>Responsive Table</title>
  </head>
  <body>
    <main>
      <div class="wrapper">
        <h1>Responsive Tables</h1>

        <table>
          <caption>
            The last 14 world F1 champions
          </caption>

          <!-- una riga in una tabella viene definita con l'element tr (table row)-->
          <!-- ho bisogno di 5 righe, una per l'header e 4 per i piloti -->
          <!-- nella riga per l'header utilizzo il tag th (table header) per indicare che una cella è l'header di un gruppo di celle -->
          <tr>
            <th>Name</th>
            <th>Poles</th>
            <th>Podium</th>
            <th>Wins</th>
            <th>Career points</th>
            <th>Championships</th>
          </tr>

          <tr>
            <!-- le celle che contengono i dati di ogni riga vengono definite con l'elemento td (table data) -->
            <!-- l'ordine dei td indica come verranno mostrate le celle, quindi se voglio che la prima cella contenga il name e sia sotto la cella header th name, devo metterla per prima -->
            <!-- per capire a cosa corrisponde un td utilizzo l'attributo data-cell, utile anche per impostare il css della tabella -->
            <td data-cell="name">Max Verstappen</td>
            <td data-cell="poles">22</td>
            <td data-cell="podiums">80</td>
            <td data-cell="wins">37</td>
            <td data-cell="career points">2080.5</td>
            <td data-cell="championships">2</td>
          </tr>
          <tr>
            <td data-cell="name">Lewis Hamilton</td>
            <td data-cell="poles">103</td>
            <td data-cell="podiums">192</td>
            <td data-cell="wins">103</td>
            <td data-cell="career points">4443.5</td>
            <td data-cell="championships">7</td>
          </tr>
          <tr>
            <td data-cell="name">Rico Rosberg</td>
            <td data-cell="poles">30</td>
            <td data-cell="podiums">57</td>
            <td data-cell="wins">23</td>
            <td data-cell="career points">1594.5</td>
            <td data-cell="championships">1</td>
          </tr>
          <tr>
            <td data-cell="name">Michael Schumacher</td>
            <td data-cell="poles">68</td>
            <td data-cell="podiums">155</td>
            <td data-cell="wins">91</td>
            <td data-cell="career points">1566</td>
            <td data-cell="championships">7</td>
          </tr>
        </table>
      </div>
    </main>
  </body>
</html>
