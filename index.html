<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <title>Responsive Table</title>
  </head>
  <body>
    <main>
      <div class="wrapper">
        <h1>Responsive Tables</h1>

        <table>
          <!-- utilizzo del tag caption per dare un titolo, un nome ad una tabella -->
          <!-- la larghezza è definita dal content della table -->
          <!-- può essere posizionato sopra o sotto la tabella -->
          <caption>
            The last 14 world F1 champions
          </caption>
        </table>
      </div>
    </main>
  </body>
</html>
